# fly launch --copy-config --no-deploy && fly deploy
# Runs one machine with an in-memory cache. For several machines, attach Redis
# and set RECURA_REDIS_URL (fly secrets set RECURA_REDIS_URL=redis://...).
app = "recura-demo"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  RECURA_CONFIG = "/examples/config.public.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
