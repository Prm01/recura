# Minimal production layout: 3 gateway replicas sharing one Redis.
# kubectl create secret generic recura-secrets \
#   --from-literal=ANTHROPIC_API_KEY=... --from-literal=RECURA_ADMIN_KEY=... \
#   --from-literal=RECURA_API_KEYS='sk-team-a:team-a'
# kubectl apply -f deploy/k8s/recura.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recura
  labels: {app: recura}
spec:
  replicas: 3
  selector:
    matchLabels: {app: recura}
  template:
    metadata:
      labels: {app: recura}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: recura
          image: ghcr.io/prm01/recura:latest
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: RECURA_REDIS_URL, value: "redis://recura-redis:6379/0"}
            - {name: RECURA_THRESHOLD, value: "0.85"}
          envFrom:
            - secretRef: {name: recura-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: recura
spec:
  selector: {app: recura}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recura
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: recura}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recura-redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: recura-redis}
  template:
    metadata:
      labels: {app: recura-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: recura-redis
spec:
  selector: {app: recura-redis}
  ports: [{port: 6379}]
