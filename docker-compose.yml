# Full local stack: gateway, Redis, Prometheus and Grafana.
#   docker compose up --build
# Gateway:    http://localhost:8080   (playground UI at /)
# Grafana:    http://localhost:3000   (anonymous viewer, dashboard "Sieve")
# Prometheus: http://localhost:9090
services:
  sieve:
    build: .
    ports: ["8080:8080"]
    environment:
      SIEVE_REDIS_URL: redis://redis:6379/0
      SIEVE_CONFIG: /examples/config.compose.json
      # Add any of these to use real models; with none, a mock model answers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SIEVE_ADMIN_KEY: ${SIEVE_ADMIN_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sieve.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  redis-data:
